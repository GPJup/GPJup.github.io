<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPJup</title>
  <link rel="stylesheet" href="style.css">

  <script>
    if (window.innerWidth <= 760) {
      window.location.replace('mobile.html');
    }
  </script>
</head>
<body>

  <!-- Кнопки управления -->
  <div id="settingsOverlay" class="settings-overlay hidden">

  <div class="settings-panel">

    <div class="settings-header">
      <h2>Settings</h2>
      <button id="closeSettings" class="close-btn">✕</button>
    </div>

    <div class="setting-group">
      <label>Music volume</label>
      <input id="musicVolume" type="range" min="0" max="100" value="45">
    </div>

    <div class="setting-group">
      <label>Sound volume</label>
      <input id="soundVolume" type="range" min="0" max="100" value="100">
    </div>

  </div>

</div>
  
  <div class="controls">

  <button id="musicBtn" class="ctrl-btn" aria-label="Music">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M9 18V6l10-2v12"/>
      <circle cx="7" cy="18" r="2"/>
      <circle cx="17" cy="16" r="2"/>
    </svg>
  </button>

  <button id="skipBtn" class="ctrl-btn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M5 5v14l10-7L5 5zM19 5v14"/>
    </svg>
  </button>

  <button id="soundBtn" class="ctrl-btn" aria-label="Sound">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M5 9v6h4l5 4V5L9 9H5z"/>
      <path d="M17 9c1.5 1.2 1.5 4.8 0 6"/>
    </svg>
  </button>

  <button id="settingsBtn" class="ctrl-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 8.5A3.5 3.5 0 1 1 12 15.5A3.5 3.5 0 0 1 12 8.5z"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9.2 20a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.8a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4 9.2a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06A2 2 0 1 1 7.03 3.4l.06.06A1.7 1.7 0 0 0 9 4.6c.39 0 .77-.14 1.06-.4.29-.29.45-.67.44-1.08V3a2 2 0 1 1 4 0v.1c0 .4.16.79.44 1.08.29.26.67.4 1.06.4a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c0 .39.14.77.4 1.06.29.29.67.45 1.08.44H21a2 2 0 1 1 0 4h-.1c-.4 0-.79.16-1.08.44-.26.29-.4.67-.4 1.06z"/>
    </svg>
  </button>

</div>

  <!-- Частицы -->
  <canvas id="particles"></canvas>

  <main>

    <!-- Профиль -->
    <aside class="profile">
      <div class="avatar">
        <img src="assets/avatar.png" alt="GPJup">
      </div>

      <h1>GPJup</h1>
      <div class="handle">@GPJup</div>
    </aside>

    <!-- Ссылки -->
    <section class="links">

      <a class="card"
         data-color="#66c0f4"
         href="https://steamcommunity.com/profiles/76561199552679634"
         target="_blank">

        <img src="https://cdn.simpleicons.org/steam/ffffff" alt="Steam">
        <span>Steam</span>
      </a>

      <a class="card"
         data-color="#1ed760"
         href="https://open.spotify.com/user/315vy7ryqbl4t77ce2azesdr2uoe?si=8370fc7f52864c8f"
         target="_blank">

        <img src="https://cdn.simpleicons.org/spotify/ffffff" alt="Spotify">
        <span>Spotify</span>
      </a>

      <a class="card"
         data-color="#5865f2"
         href="https://discord.com/users/793073674467016715"
         target="_blank">

        <img src="https://cdn.simpleicons.org/discord/ffffff" alt="Discord">
        <span>Discord</span>
      </a>

      <a class="card"
         data-color="#ff0050"
         href="https://www.tiktok.com/@gpj_up"
         target="_blank">

        <img src="https://cdn.simpleicons.org/tiktok/ffffff" alt="TikTok">
        <span>TikTok</span>
      </a>

      <a class="card"
         data-color="#229ed9"
         href="https://t.me/Gdshmak"
         target="_blank">

        <img src="https://cdn.simpleicons.org/telegram/ffffff" alt="Telegram">
        <span>Telegram</span>
      </a>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
